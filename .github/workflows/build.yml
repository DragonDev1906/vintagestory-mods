name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.list.outputs.mods }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List mods
        id: list
        run: |
          mods=$(find -type f -name modinfo.json -not -path '*/bin/*' -not -path '*/Releases/*' \
            | sed 's_^\./\([^/]*\)/.*_\1_' | sort -u | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          echo "Found mods: $mods"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mod: ${{ fromJSON(needs.discover.outputs.mods) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install json5
        run: npm install -g json5

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v4
        with:
          path: ~/vs
          key: vs-server-linux-x64-1.22.6

      - name: Download Vintage Story server (for API DLLs)
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.6.tar.gz"
          mkdir -p ~/vs
          tar -xzf vs_server.tar.gz -C ~/vs

      - name: Export VINTAGE_STORY
        run: |
          DLL_DIR="$(dirname "$(find ~/vs -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.mod }}
        run: ./build.sh "${{ matrix.mod }}"

      - name: Upload ${{ matrix.mod }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}
          path: Releases/${{ matrix.mod }}_*.zip
          if-no-files-found: error
