name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mods:
        description: 'Comma-separated list of mods to build (or "all")'
        required: false
        default: 'all'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      mods: ${{ steps.determine.outputs.mods }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine mods to build
        id: determine
        run: |
          mods=$(./discover.sh)
          {
            echo "mods<<EOF"
            echo "$mods"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Build matrix: $mods"
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          INPUT_MODS: ${{ github.event.inputs.mods }}

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.mods) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          version=$(jq -r '.version' "${{ matrix.mod }}/modinfo.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.mod }} $version"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install json5
        run: npm install -g json5

      - name: Cache Vintage Story server
        id: cache-vs
        uses: actions/cache@v6
        with:
          path: ~/vs
          key: vs-server-linux-x64-1.22.6

      - name: Download Vintage Story server (for API DLLs)
        if: steps.cache-vs.outputs.cache-hit != 'true'
        run: |
          set -e
          curl -sSL -o vs_server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_server_linux-x64_1.22.6.tar.gz"
          mkdir -p ~/vs
          tar -xzf vs_server.tar.gz -C ~/vs

      - name: Export VINTAGE_STORY
        run: |
          DLL_DIR="$(dirname "$(find ~/vs -name VintagestoryAPI.dll | head -1)")"
          echo "VINTAGE_STORY=$DLL_DIR" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.mod }}
        run: ./build.sh "${{ matrix.mod }}"

      - name: Upload ${{ matrix.mod }}_${{ steps.version.outputs.version }}
        if: matrix.upload
        uses: actions/upload-artifact@v7
        with:
          path: Releases/${{ matrix.mod }}_${{ steps.version.outputs.version }}.zip
          archive: false
          if-no-files-found: error
